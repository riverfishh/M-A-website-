# Pages CMS configuration (https://pagescms.org)
# Everything the club posts is saved as a small JSON file in this repo.
# The website reads it through data/events.json and data/news.json (publications),
# which scripts/build_content.py rebuilds on every deploy.

media:
  input: assets/uploads
  output: assets/uploads
  extensions: [jpg, jpeg, png, webp, pdf]

content:
  - name: events
    label: Events
    type: collection
    path: content/events
    format: json
    filename: "{primary}.json"
    view:
      fields: [title, date, category]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Type of event
        type: select
        required: true
        default: Event
        options:
          values: [Event, Information fair, Speaker/Panel, Workshop, Case study, Networking, Social]
      - name: date
        label: Date
        type: date
        required: true
      - name: start_time
        label: Starts at
        type: string
        description: "24-hour time, for example 18:30"
      - name: end_time
        label: Ends at
        type: string
        description: "24-hour time, for example 20:00 (optional)"
      - name: location
        label: Location
        type: string
        description: "For example: Carlota A Auditorium, Nova SBE"
      - name: image
        label: Event photo
        type: image
        description: "Wide photos work best (around 1600 x 800). Optional."
      - name: speakers
        label: Speakers
        type: string
        description: "For example: Professionals from J.P. Morgan, Goldman Sachs and Citi (optional)"
      - name: description
        label: About the event
        type: text
        description: "Plain text. Leave a blank line between paragraphs."
      - name: draft
        label: Hide from the website
        type: boolean
        default: false
        description: "Switch on to keep this event off the site while you are still writing it."

  - name: news
    label: Publications
    type: collection
    path: content/news
    format: json
    filename: "{primary}.json"
    view:
      fields: [title, date, category]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Topic
        type: select
        required: true
        default: Article
        options:
          values: [Article, Research, Newsletter, Announcement]
      - name: date
        label: Date
        type: date
        required: true
      - name: pdf
        label: PDF
        type: file
        description: "The publication itself. It opens on the website in a built-in PDF viewer, with a download button."
      - name: image
        label: Cover photo
        type: image
        description: "Optional. Shown on the publication card."
      - name: summary
        label: Short summary
        type: text
        description: "One or two sentences shown on the publication card."
      - name: body
        label: Text under the PDF
        type: text
        description: "Optional. Plain text, with a blank line between paragraphs. Without a PDF, this is the article."
      - name: draft
        label: Hide from the website
        type: boolean
        default: false
        description: "Switch on to keep this publication off the site while you are still writing it."

  - name: team
    label: Team members
    type: collection
    path: content/team
    format: json
    filename: "{primary}.json"
    view:
      fields: [name, department, role]
      primary: name
      sort: [department, name]
      default:
        sort: department
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: department
        label: Department
        type: select
        required: true
        options:
          values: [Board, Operations, Research, Relations, Marketing, Legal]
      - name: role
        label: Role
        type: string
        description: "For example: Head of Research, Associate, Analyst"
      - name: photo
        label: Photo
        type: image
        description: "A portrait photo, taller than it is wide (about 800 x 1000). Without one, the person's initials are shown."
      - name: order
        label: Position in the list
        type: number
        description: "Optional. Lower numbers come first; heads are usually 1. People with the same number are sorted by name."
      - name: draft
        label: Hide from the website
        type: boolean
        default: false
        description: "Switch on for someone who has left or should not be shown yet."

  - name: departments
    label: Departments
    type: file
    path: content/departments.json
    format: json
    fields:
      - name: departments
        label: Departments
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
            required: true
            description: "Must match the department chosen on team members, so rename it there too."
          - name: summary
            label: What the department does
            type: text
          - name: tasks
            label: Key tasks
            type: string
            list: true
